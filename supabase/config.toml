# FluoFit local Supabase config. Run `npx supabase start` to bring up Postgres + Auth locally.
project_id = "fluofit"

[db]
port = 54322
major_version = 15

[api]
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[studio]
port = 54323

[auth]
enable_signup = true
# Passwordless email-first is the canonical Member entry (ADR-0010, ADR-0012).
[auth.email]
enable_signup = true
enable_confirmations = false
# Admin + Member passwordless flows use verifyOtp (6-digit). Default template
# only includes the magic link — include {{ .Token }} so Mailpit/inbox shows the OTP.
otp_length = 6
[auth.email.template.magic_link]
subject = "Your login code"
content_path = "./supabase/templates/magic_link.html"
